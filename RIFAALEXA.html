<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Alexa - Interactiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* General body styles */
        body {
            font-family: 'Nunito', sans-serif;
            display: flex;
            align-items: center;
            min-height: 100vh; /* Ensure full height */
            margin: 0;
            padding: 20px;
            flex-direction: column; /* Align items vertically */
        }

        .main-container {
            position: relative;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center; /* Center content */
            max-width: 800px; /* Limit width */
            margin: 20px auto;
            width: 100%;
            overflow: hidden; /* Para asegurar que los elementos absolutely positioned no se salgan */
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.pinimg.com/736x/a9/6c/97/a96c9742e6218842629c89c03c750e8c.jpg'); /* Reemplaza con tu imagen */
            background-size: cover;
            z-index: -1;
            opacity: 0.3;
        }

        h1 {
            font-size: 60px;
            margin: 0;
            color: #000;
            line-height: 1;
            font-family: 'Bungee', cursive;
        }


        .price-tag {
            background: #000;
            color: #fff;
            font-family: 'Bungee', cursive;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 24px;
            margin: 20px 0;
        }

        .grid-container {
            /* Grid layout for numbers */
            position: relative; /* Para el posicionamiento de los números */
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin: 30px 0;
            position: relative;
            padding: 10px; /* Add padding inside the grid */
        }

        /* Estilo de los números */
        .number {
            width: 50px;
            height: 50px;
            background: #eee;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #ddd;
            user-select: none; /* Prevent text selection */
        }

        .number:hover {
            background: #ddd;
        }

        /* Clase cuando ya está ocupado */
        .number.occupied {
            background: #444 !important;
            color: #444 !important; /* Oculta el número para que parezca cubierto */
            font-size: 0; /* Hide the number text */
            position: relative; /* For the pseudo-element */
            border-color: #000;
            cursor: not-allowed;
        }


        /* Espacio para la imagen central */
        .alexa-center {
            grid-column: 4 / 8;
            grid-row: 2 / 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .alexa-center img {
            max-width: 180px;
            height: auto;
            border-radius: 10px; /* add a border radius to the image */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* add a subtle shadow */
        }

        .caption {
            font-size: 12px;
            font-weight: normal;
            color: #666;

            font-family: Arial;
        }

        .footer-info {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-top: 30px;
            color: #333;
            line-height: 1.5;
            font-family: Arial, sans-serif;
        }

        .download-button {
            display: block;
            width: 280px;
            font-family: 'Bungee', cursive;
            margin: 30px auto 0;
            padding: 15px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
        .download-button:hover { background-color: #0056b3; }

        /* Media query for smaller screens */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(5, 1fr); /* Adjust grid for smaller screens */
            }
            .number {
                width: 35px; /* Smaller number circles */
                height: 35px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>¡¡RIFA ENTRE FAMILIA Y AMIGOS!!<br>-BOCINA ALEXA-</h1>
    
    <div class="price-tag">2 X $100 PESOS</div>

    <div class="grid-container" id="raffleGrid">
    </div>

    <div class="footer-info">
        Juega con los últimos dos números del premio mayor de la Lotería Nacional.
        <br>
        <b>Fecha del sorteo: 20 de Febrero.</b>
    </div>
</div>

<button id="downloadBtn" class="download-button">Descargar Interfaz (PNG)</button>
<script>
    const grid = document.getElementById('raffleGrid');
    
    // Crear la estructura de la cuadrícula
    function initRaffle() {
        // Insertamos la imagen central primero (posicionada por CSS)
        const center = document.createElement('div');
        center.className = 'alexa-center';
        center.innerHTML = `
            <img src="alexa.png" alt="Alexa Echo Dot">
            <div class="caption">Imagen representativa</div>
        `;
        grid.appendChild(center);

        // Generar 100 números del 00 al 99
        for (let i = 0; i < 100; i++) {
            const numStr = i.toString().padStart(2, '0');
            const numBtn = document.createElement('div');
            numBtn.className = 'number';
            numBtn.innerText = numStr;
            numBtn.onclick = () => handleSelection(numBtn, numStr);
            grid.appendChild(numBtn);
        }
    }

    function handleSelection(element, num) {
        if (element.classList.contains('occupied')) return;

        // Primera confirmación
        const confirm1 = confirm(`¿Deseas seleccionar el número ${num}?`);
        
        if (confirm1) {
            // Segunda confirmación
            const confirm2 = confirm(`¿Confirmas que el número ${num} ya está pagado/ocupado?\nEsta acción no se puede deshacer.`);
            
            if (confirm2) {
                element.classList.add('occupied');
            }
        }
    }

    initRaffle();

    document.getElementById('downloadBtn').addEventListener('click', function() {
        html2canvas(document.querySelector(".main-container"), { backgroundColor: null }).then(canvas => {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = 'rifa-alexa.png';
            a.click();
        });
    });
</script>

</body>
</html>
