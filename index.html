<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas del Pueblo - Smart TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #1e293b; overflow-x: hidden; }
        
        /* CAPAS DE UI */
        #guia-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 8000; display: block; }
        
        #asistente-maya { 
            position: fixed; z-index: 9000; display: flex; flex-direction: column-reverse; 
            align-items: center; width: 340px; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); 
            pointer-events: none; 
        }

        .burbuja-dialogo { 
            background: white; padding: 28px; border-radius: 35px; border: 4px solid #2563eb; 
            width: 100%; pointer-events: auto; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
        }

        .btn-idioma { position: relative; z-index: 10001 !important; pointer-events: auto !important; }

        /* POSICIONAMIENTO */
        .pos-centro { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .pos-guia-top { top: 30px; left: 50%; transform: translateX(-50%) scale(0.85); }
        .pos-registro { bottom: 130px; left: 50%; transform: translateX(-50%) scale(0.9); }

        /* FOCO DE LUZ */
        #area-buscador { position: sticky; top: 0; z-index: 100; background: white; padding: 15px 0; border-bottom: 1px solid #f1f5f9; }
        .foco-activo { 
            position: relative !important; z-index: 8500 !important; 
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.85), 0 0 50px rgba(59, 130, 246, 0.6) !important; 
            pointer-events: auto !important; 
        }

        /* GRID */
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 1200px; margin: 0 auto; }
        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(10, 1fr); } }
        @media (min-width: 1024px) { .grid-container { grid-template-columns: repeat(20, 1fr); } }
        
        .numero { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: white; font-weight: 800; font-size: 0.8rem; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
        .encontrado-flash { background: #FFD700 !important; color: black !important; transform: scale(1.6); z-index: 8600 !important; box-shadow: 0 0 30px #FFD700; border: 2px solid white !important; }
        .seleccionado { background: #2563eb !important; color: white !important; border: none; transform: scale(1.1); }
        .ocupado { background: #f1f5f9 !important; color: #cbd5e1 !important; cursor: not-allowed; opacity: 0.4; }
        
        /* ESTADO ERROR */
        .base-error { border-color: #ef4444 !important; }
        .text-error { color: #ef4444 !important; }
    </style>
</head>
<body>

    <div id="guia-overlay"></div>
    
    <div id="asistente-maya" class="pos-centro">
        <img src="asist.png" alt="Asistente" class="w-[130px] drop-shadow-2xl">
        <div id="burbuja" class="burbuja-dialogo">
            <div onclick="saltarGuia()" class="absolute top-4 right-4 text-slate-300 cursor-pointer p-1"><i class="fas fa-times text-xl"></i></div>

            <p id="texto-asistente" class="text-base font-extrabold text-slate-800 leading-tight mb-6 text-center">
                ¡Hola! Soy tu asistente.<br>¿En qué idioma te ayudo?
            </p>
            
            <div id="selector-idioma" class="flex flex-col gap-3">
                <button onclick="iniciar('es')" class="btn-idioma bg-blue-600 text-white py-5 rounded-2xl font-black text-sm uppercase w-full shadow-xl active:scale-95">Español</button>
                <button onclick="iniciar('maya')" class="btn-idioma bg-slate-900 text-white py-5 rounded-2xl font-black text-sm uppercase w-full shadow-xl active:scale-95">Maya T'aan</button>
            </div>

            <div id="form-nombre" class="hidden flex flex-col gap-3">
                <input type="text" id="nombre-input" placeholder="Nombre Completo" class="w-full p-4 border-2 border-slate-200 rounded-xl font-bold text-center outline-none focus:border-blue-500">
                <button id="btn-confirmar" onclick="confirmarTodo()" class="bg-green-600 text-white py-4 rounded-xl font-black uppercase text-xs">Confirmar Registro</button>
            </div>
            
            <button id="btn-next" onclick="proximoPaso()" class="hidden w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase text-xs mt-2">Entendido →</button>
        </div>
    </div>

    <nav class="bg-[#0f172a] py-4 px-6 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-2">
            <img src="logo.png" alt="Logo" class="h-8">
            <span class="text-white font-extrabold italic uppercase text-sm">Rifas <span class="text-blue-5
