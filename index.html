<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas del Pueblo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: #1e293b; margin: 0; padding: 0; }
        
        /* ASISTENTE Y CAPAS */
        #guia-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 8000; display: block; }
        #asistente-maya { position: fixed; z-index: 9999; display: flex; flex-direction: column-reverse; align-items: center; width: 320px; transition: all 0.4s ease; pointer-events: none; }
        .burbuja { background: white; padding: 25px; border-radius: 30px; border: 4px solid #2563eb; width: 100%; pointer-events: auto; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .btn-idioma { cursor: pointer !important; position: relative; z-index: 10000; }
        
        .pos-centro { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .pos-guia-top { top: 20px; left: 50%; transform: translateX(-50%) scale(0.85); }
        .pos-registro { bottom: 120px; left: 50%; transform: translateX(-50%) scale(0.9); }

        /* GRID */
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 1200px; margin: 0 auto; }
        @media (min-width: 768px) { .grid-container { grid-template-columns: repeat(10, 1fr); } }
        @media (min-width: 1024px) { .grid-container { grid-template-columns: repeat(20, 1fr); } }
        
        .numero { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: white; font-weight: 800; font-size: 0.8rem; border: 1px solid #e2e8f0; cursor: pointer; }
        .encontrado-flash { background: #FFD700 !important; color: #000 !important; transform: scale(1.5); z-index: 8500; box-shadow: 0 0 20px #FFD700; }
        .seleccionado { background: #2563eb !important; color: white !important; border: none; }
        .ocupado { background: #f1f5f9 !important; color: #cbd5e1 !important; cursor: not-allowed; opacity: 0.5; }
        
        .foco-activo { position: relative !important; z-index: 8100 !important; box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.85), 0 0 40px #3b82f6 !important; }
    </style>
</head>
<body>

    <div id="guia-overlay"></div>
    
    <div id="asistente-maya" class="pos-centro">
        <img src="asist.png" alt="Asistente" class="w-[120px]">
        <div class="burbuja">
            <div onclick="saltarGuia()" class="absolute top-2 right-4 text-slate-300 cursor-pointer text-2xl">&times;</div>
            <p id="texto-asistente" class="text-sm font-black text-center mb-4">¡Hola! Soy tu asistente.<br>¿En qué idioma te ayudo?</p>
            
            <div id="selector-idioma" class="flex flex-col gap-2">
                <button onclick="iniciar('es')" class="btn-idioma bg-blue-600 text-white py-4 rounded-xl font-black uppercase text-xs shadow-lg">Español</button>
                <button onclick="iniciar('maya')" class="btn-idioma bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-xs shadow-lg">Maya T'aan</button>
            </div>

            <div id="form-nombre" class="hidden flex flex-col gap-2">
                <input type="text" id="nombre-input" placeholder="Tu Nombre" class="w-full p-3 border-2 border-slate-200 rounded-xl text-center font-bold outline-none">
                <button onclick="confirmarTodo()" class="bg-green-600 text-white py-4 rounded-xl font-black uppercase text-xs">Confirmar</button>
            </div>
            
            <button id="btn-next" onclick="proximoPaso()" class="hidden w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase text-xs mt-2">Entendido →</button>
        </div>
    </div>

    <nav class="bg-[#0f172a] py-4 px-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <img src="logo.png" class="h-6">
            <span class="text-white font-black italic text-xs uppercase">Rifas del Pueblo</span>
        </div>
    </nav>

    <header class="text-center py-6">
        <img src="tv-hisense.png" class="w-40 mx-auto mb-2">
        <h1 class="text-xl font-black uppercase italic">¡Smart TV 50´´ <span class="text-blue-600">Gratis!</span></h1>
    </header>

    <div id="area-buscador" class="sticky top-0 bg-white p-4 z-50 border-b">
        <input type="text" inputmode="numeric" id="buscador" oninput="buscar()" placeholder="Busca tu número..." class="w-full p-4 border-2 rounded-2xl text-center font-bold text-xl">
    </div>

    <main class="p-4">
        <div id="area-grid" class="bg-white p-4 rounded-3xl border shadow-inner">
            <div class="grid-container" id="grid-numeros"></div>
        </div>
    </main>

    <div class="h-24"></div>
    <div class="fixed bottom-0 inset-x-0 p-4 bg-white border-t z-[7000] flex justify-center">
        <button onclick="pedirNombre()" id="btn-registrar" class="w-full max-w-md bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-lg">Registrar número</button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5DtknopaEk6CoentxuqUsc9XPJpM5KbIbngmqffLfzEwH5PvG-FqW8Vf_jFqdxqTs/exec";
        const textos = {
            es: { busca: "Busca tu número libre.", toca: "Toca tu número de la suerte.", listo: "¡Bien! Ahora toca Registrar.", nombre: "Escribe tu nombre completo.", final: "¡Listo! Vamos a Messenger.", error: "⚠️ Error de base de datos. Intenta más tarde.", reg: "Registrar número", ph: "Busca tu número..." },
            maya: { busca: "Kaaxat a xook.", toca: "T'aka' a xook.", listo: "¡Ma'alob! Beoraé Registrar.", nombre: "Ts'íibta a k'aaba'.", final: "¡Beyo'! Bin Messenger.", error: "⚠️ Yan jump'éel talamil.", reg: "P'at in xook", ph: "Kaaxat xook waye'..." }
        };
        let lang = 'es', paso = 0, elegido = null;

        function saltarGuia() {
            document.getElementById('guia-overlay').style.display = "none";
            document.getElementById('asistente-maya').style.display = "none";
            document.querySelectorAll('.foco-activo').forEach(e => e.classList.remove('foco-activo'));
        }

        function iniciar(l) {
            lang = l;
            document.getElementById('selector-idioma').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('btn-registrar').innerText = textos[lang].reg;
            document.getElementById('buscador').placeholder = textos[lang].ph;
            proximoPaso();
        }

        function proximoPaso() {
            document.querySelectorAll('.foco-activo').forEach(e => e.classList.remove('foco-activo'));
            const maya = document.getElementById('asistente-maya');
            const txt = document.getElementById('texto-asistente');
            if (paso === 0) {
                maya.className = "pos-guia-top";
                document.getElementById('area-buscador').classList.add('foco-activo');
                txt.innerText = textos[lang].busca;
                paso++;
            } else if (paso === 1) {
                document.getElementById('area-grid').classList.add('foco-activo');
                txt.innerText = textos[lang].toca;
                paso++;
            } else { saltarGuia(); }
        }

        function crearGrid() {
            const grid = document.getElementById('grid-numeros');
            grid.innerHTML = "";
            for (let i = 0; i < 1000; i++) {
                let n = i.toString().padStart(3, '0');
                let d = document.createElement('div');
                d.innerText = n; d.id = `num-${n}`; d.className = 'numero';
                d.onclick = () => seleccionar(n);
                grid.appendChild(d);
            }
        }

        async function cargarOcupados() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                data.forEach(item => {
                    const el = document.getElementById(`num-${item.numero}`);
                    if (el && item.estado === "Vendido") {
                        el.className = 'numero ocupado';
                        el.onclick = null;
                    }
                });
            } catch(e) {
                // Si falla Google, el asistente avisa pero la página sigue viva
                document.getElementById('texto-asistente').innerText = textos[lang].error;
            }
        }

        function buscar() {
            let val = document.getElementById('buscador').value;
            if (!val) return;
            document.querySelectorAll('.encontrado-flash').forEach(e => e.classList.remove('encontrado-flash'));
            let id = val.toString().padStart(3, '0').slice(-3);
            const el = document.getElementById(`num-${id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('encontrado-flash');
            }
        }

        function seleccionar(n) {
            if (elegido) document.getElementById(`num-${elegido}`)?.classList.remove('seleccionado');
            elegido = n;
            document.getElementById(`num-${n}`).classList.add('seleccionado');
            document.getElementById('guia-overlay').style.display = "none";
            document.getElementById('asistente-maya').className = "pos-registro";
            document.getElementById('texto-asistente').innerText = textos[lang].listo;
            document.getElementById('btn-next').classList.add('hidden');
        }

        function pedirNombre() {
            if (!elegido) return;
            document.getElementById('guia-overlay').style.display = "block";
            document.getElementById('asistente-maya').style.display = "flex";
            document.getElementById('asistente-maya').className = "pos-centro";
            document.getElementById('texto-asistente').innerText = textos[lang].nombre;
            document.getElementById('form-nombre').classList.remove('hidden');
        }

        async function confirmarTodo() {
            const nom = document.getElementById('nombre-input').value.trim();
            if (nom.length < 3) return;
            const params = new URLSearchParams();
            params.append('numero', elegido);
            params.append('nombre', nom);
            try {
                fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: params });
                document.getElementById('texto-asistente').innerText = textos[lang].final;
                setTimeout(() => { window.location.href = `https://m.me/168173419701763?text=Aparté el ${elegido} - ${nom}`; }, 1500);
            } catch(e) { window.location.reload(); }
        }

        // INICIO CRÍTICO
        crearGrid();
        cargarOcupados();
    </script>
</body>
</html>
