<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteos | Rifas del Pueblo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        
        :root {
            --color-primario: #002d72; /* Azul corporativo */
            --color-secundario: #00a1e1; /* Celeste vibrante */
            --color-acento: #ff6b00; /* Naranja para llamadas a la acción */
        }

        body { background-color: #fcfcfc; font-family: 'Outfit', sans-serif; color: #0f172a; }
        
        .grid-rifa { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; padding: 15px; }
        
        .numero { background: white; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px 0; text-align: center; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .numero:hover { border-color: var(--color-secundario); background: #f0f9ff; transform: scale(1.05); }
        
        .ocupado { background: #e2e8f0 !important; color: #94a3b8; cursor: not-allowed; border: none; opacity: 0.6; }
        
        .seleccionado { 
            background: var(--color-primario) !important; 
            color: white !important; 
            border-color: var(--color-primario);
            box-shadow: 0 8px 15px rgba(0, 45, 114, 0.3);
        }
        
        /* Asistente */
        #asistente-contenedor { position: fixed; z-index: 100; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .pos-inicio { bottom: 50%; left: 50%; transform: translate(-50%, 50%); }
        .pos-busqueda { bottom: 30px; left: 30px; transform: scale(0.8); }
        .pos-centro { bottom: 50%; left: 50%; transform: translate(-50%, 50%) scale(1.1); }
        
        .burbuja { 
            background: white; padding: 25px; border-radius: 30px; 
            border: 3px solid var(--color-secundario);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            min-width: 280px; 
        }
        .maya-img { width: 130px; margin: -15px auto 0; display: block; }
        
        .hidden { display: none !important; }
        
        .hero-card {
            background: linear-gradient(135deg, var(--color-primario) 0%, #001535 100%);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
        }
    </style>
</head>
<body class="pb-32">

    <nav class="flex justify-center py-6 bg-white shadow-sm mb-6">
        <img src="logo.png" alt="Logo" class="h-14">
    </nav>

    <main class="max-w-3xl mx-auto px-4">
        <div class="hero-card p-8 text-white mb-10 shadow-2xl relative overflow-hidden">
            <div class="relative z-10 flex flex-col md:flex-row items-center gap-6">
                <div class="flex-1 text-center md:text-left">
                    <span class="bg-sky-400/20 text-sky-300 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest">Sorteo Especial</span>
                    <h1 class="text-4xl font-black mt-2 leading-none">TV HISENSE <br><span class="text-sky-400">4K SMART</span></h1>
                    <p class="mt-4 text-sky-100/80 font-light">Participa por una experiencia de cine en casa.</p>
                </div>
                <div class="flex-1">
                    <img src="tv-hisense.png" alt="TV Hisense" class="w-full h-auto drop-shadow-[0_20px_30px_rgba(0,0,0,0.5)] transform hover:scale-105 transition-transform duration-500">
                </div>
            </div>
        </div>

        <div class="mb-8">
            <input type="text" id="buscador" oninput="gestionarBusqueda()" placeholder="🔍 Busca tu número de la suerte..." 
                class="w-full bg-white border-2 border-slate-100 p-5 rounded-2xl text-center font-bold text-xl shadow-sm focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 outline-none transition-all">
        </div>

        <div id="grid-numeros" class="grid-rifa"></div>
    </main>

    <div id="asistente-contenedor" class="pos-inicio">
        <div class="burbuja">
            <p id="texto-asistente" class="text-lg font-bold text-center mb-6 leading-tight">Estoy aquí para ayudarte.<br><span class="text-slate-400 font-medium text-sm text-center block mt-1">¿En qué idioma te ayudo?</span></p>
            <div id="ui-asistente">
                <div id="selector-idioma" class="flex flex-col gap-3">
                    <button onclick="iniciar('es')" class="bg-[#002d72] text-white py-4 rounded-2xl font-bold hover:bg-blue-800 transition-all shadow-lg">Español</button>
                    <button onclick="iniciar('maya')" class="bg-slate-100 text-slate-700 py-4 rounded-2xl font-bold hover:bg-slate-200 transition-all">Maya T'aan</button>
                </div>
                <div id="form-nombre" class="hidden space-y-3">
                    <input type="text" id="nombre-input" placeholder="Escribe tu nombre" class="w-full p-4 border-2 border-slate-100 rounded-2xl text-center font-bold focus:border-sky-500 outline-none">
                    <button onclick="confirmarTodo()" class="w-full bg-[#ff6b00] text-white py-4 rounded-2xl font-black uppercase tracking-wider shadow-lg hover:bg-orange-600 transition-all">Finalizar Registro</button>
                </div>
            </div>
        </div>
        <img src="asist.png" class="maya-img" alt="Asistente">
    </div>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-full max-w-xs px-4">
        <button id="btn-registrar" disabled onclick="pedirNombre()" 
            class="w-full bg-[#002d72] text-white py-5 rounded-3xl font-black uppercase text-sm tracking-widest shadow-[0_15px_30px_rgba(0,45,114,0.4)] disabled:bg-slate-300 disabled:shadow-none transition-all active:scale-95">
            Reservar número
        </button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5DtknopaEk6CoentxuqUsc9XPJpM5KbIbngmqffLfzEwH5PvG-FqW8Vf_jFqdxqTs/exec";
        const textos = {
            es: { busca: "Busca tu número abajo", registrar: "¡Toca Reservar!", nombre: "Escribe tu nombre", final: "¡Enviado! Vamos a Messenger" },
            maya: { busca: "Kaaxat a xook", registrar: "T'aka' Reservar", nombre: "Ts'íibta a k'aaba'", final: "¡Beyo'! Bin Messenger" }
        };

        let lang = 'es', elegido = null;

        function iniciar(l) {
            lang = l;
            document.getElementById('selector-idioma').classList.add('hidden');
            document.getElementById('asistente-contenedor').className = "pos-busqueda";
            document.getElementById('texto-asistente').innerText = textos[lang].busca;
            cargarOcupados();
        }

        function generarGrid() {
            const grid = document.getElementById('grid-numeros');
            for (let i = 0; i < 1000; i++) {
                let n = i.toString().padStart(3, '0');
                let d = document.createElement('div');
                d.id = 'num-' + n; d.className = 'numero'; d.innerText = n;
                d.onclick = () => {
                    if(d.classList.contains('ocupado')) return;
                    if(elegido) document.getElementById('num-'+elegido).classList.remove('seleccionado');
                    elegido = n;
                    d.classList.add('seleccionado');
                    document.getElementById('btn-registrar').disabled = false;
                    document.getElementById('texto-asistente').innerText = textos[lang].registrar;
                };
                grid.appendChild(d);
            }
        }

        function gestionarBusqueda() {
            let val = document.getElementById('buscador').value.replace(/\D/g, '');
            if (val.length >= 1) {
                let id = val.padStart(3, '0');
                const el = document.getElementById('num-' + id);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function pedirNombre() {
            document.getElementById('asistente-contenedor').className = "pos-centro";
            document.getElementById('texto-asistente').innerText = textos[lang].nombre;
            document.getElementById('form-nombre').classList.remove('hidden');
        }

        async function confirmarTodo() {
            const nom = document.getElementById('nombre-input').value;
            if(!nom || !elegido) return;
            const params = new URLSearchParams({ numero: elegido, nombre: nom });
            await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: params });
            window.location.href = "https://m.me/168173419701763?text=Aparté el número: " + elegido + " para la TV Hisense";
        }

        async function cargarOcupados() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                data.forEach(item => {
                    const el = document.getElementById('num-' + item.numero);
                    if (el && item.estado === "Vendido") el.classList.add('ocupado');
                });
            } catch(e) {}
        }

        generarGrid();
    </script>
</body>
</html>
