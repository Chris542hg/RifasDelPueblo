<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteos | Rifas del Pueblo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        :root { --color-primario: #002d72; --color-secundario: #00a1e1; --color-acento: #ff6b00; }
        body { background-color: #f8fafc; font-family: 'Outfit', sans-serif; color: #0f172a; margin: 0; }

        /* HEADER: BANNER AZUL Y LOGO */
        header { position: relative; height: auto; min-height: 120px; z-index: 50; }
        .banner-vertical {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 110px; height: 130px; background: var(--color-primario);
            z-index: 10; border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 25px rgba(0,45,114,0.3);
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }
        #logo-header { max-width: 90%; max-height: 80%; object-fit: contain; }

        /* BOTON FB SUPERIOR */
        .fb-top-right {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: #1877F2; color: white; padding: 10px 18px;
            border-radius: 50px; font-weight: bold; display: flex;
            align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-decoration: none; transition: transform 0.2s;
        }
        .fb-top-right:hover { transform: scale(1.05); }

        /* HERO CARD */
        .hero-card { 
            background: linear-gradient(135deg, #002d72 0%, #001535 100%); 
            border-radius: 40px; position: relative; overflow: hidden; 
        }
        .ribbon { position: absolute; top: 0; right: 0; width: 120px; height: 120px; overflow: hidden; }
        .ribbon span {
            position: absolute; display: block; width: 180px; padding: 8px 0;
            background-color: #ef4444; color: #fff; font: 700 11px 'Outfit';
            text-transform: uppercase; text-align: center; right: -45px; top: 25px; transform: rotate(45deg);
        }

        /* NUMEROS */
        .grid-rifa { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; padding: 20px 0; }
        .numero { background: white; border: 2px solid #e2e8f0; border-radius: 15px; padding: 18px 0; text-align: center; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .numero:hover { border-color: var(--color-secundario); transform: translateY(-3px); }
        .ocupado { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; border: none; }
        .seleccionado { background: var(--color-primario) !important; color: white !important; scale: 1.1; }

        /* ASISTENTE */
        #asistente-contenedor { position: fixed; z-index: 100; transition: all 0.5s ease; }
        .pos-inicio { bottom: 50%; left: 50%; transform: translate(-50%, 50%); }
        .pos-busqueda { bottom: 30px; left: 30px; transform: scale(0.85); }
        .pos-centro { bottom: 50%; left: 50%; transform: translate(-50%, 50%) scale(1.1); }
        .burbuja { background: white; padding: 25px; border-radius: 30px; border: 3px solid var(--color-secundario); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .maya-img { width: 120px; margin: -10px auto 0; display: block; }

        /* FLECHA IR ARRIBA */
        #btn-ir-arriba {
            position: fixed; bottom: 100px; right: 25px; background: var(--color-primario);
            color: white; width: 50px; height: 50px; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
            z-index: 90; cursor: pointer; border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
            /* Ajustes de suavizado responsivo */
        html { scroll-behavior: smooth; }
        body { 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
            width: 100%;
        }
        
        /* Grid mejorado: Se adapta al ancho exacto del dispositivo */
        .grid-rifa { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); 
            gap: 8px; 
            padding: 15px;
            max-width: 100%;
        }

        /* En tablets y PC los números son un poco más grandes */
        @media (min-width: 768px) {
            .grid-rifa { 
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); 
                gap: 12px; 
            }
        }

        /* Animación de entrada para los elementos */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Ajuste de botones inferiores para no estorbar en móviles modernos */
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="pb-32">

    <header>
        <div class="banner-vertical">
            <img src="logo.png" alt="Logo" id="logo-header">
        </div>
        <a href="https://www.facebook.com/168173419701763" target="_blank" class="fb-top-right">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            <span>Facebook</span>
        </a>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
        <div class="hero-card p-8 text-white mb-10 shadow-2xl">
            <div class="ribbon"><span>SORTEO</span></div>
            <div class="flex flex-col md:flex-row items-center gap-6 relative z-10">
                <div class="flex-1 text-center md:text-left">
                    <span class="bg-red-600 text-white px-4 py-1 rounded-full text-xs font-bold uppercase animate-pulse">Sorteo Especial GRATIS</span>
                    <h1 class="text-4xl font-black mt-2 leading-none uppercase">SMART TV HISENSE <br><span class="text-sky-400 text-3xl">FULL HD 50¨</span></h1>
                    <p class="mt-4 text-sky-100/80 font-light italic">¡Participa ahora sin costo!</p>
                </div>
                <div class="flex-1">
                    <img src="tv-hisense.png" alt="TV Hisense" class="w-full h-auto drop-shadow-2xl">
                </div>
            </div>
        </div>

                <div class="mb-8 flex flex-col sm:flex-row gap-3 px-2 fade-in">
            <button onclick="elegirAlAzar()" class="bg-slate-800 text-white px-6 rounded-2xl font-bold uppercase shadow-lg hover:bg-slate-900 transition-all text-xs md:text-sm">Al Azar</button>
            <input type="text" id="buscador" onkeypress="if(event.key==='Enter') ejecutarBusqueda()" placeholder="🔍 Busca tu número..." 
                class="flex-1 bg-white border-2 border-slate-100 p-5 rounded-2xl text-center font-bold text-xl outline-none focus:border-sky-500">
            <button onclick="ejecutarBusqueda()" class="bg-[#ff6b00] text-white px-8 rounded-2xl font-bold uppercase shadow-lg hover:bg-orange-600">Buscar</button>
        </div>

        <div id="grid-numeros" class="grid-rifa"></div>
    </main>

    <div id="asistente-contenedor" class="pos-inicio">
        <div class="burbuja">
            <p id="texto-asistente" class="text-lg font-bold text-center mb-6">¿En qué idioma te ayudo?</p>
            <div id="ui-asistente">
                <div id="selector-idioma" class="flex flex-col gap-3">
                    <button onclick="iniciar('es')" class="bg-[#002d72] text-white py-4 rounded-2xl font-bold">Español</button>
                    <button onclick="iniciar('maya')" class="bg-slate-100 text-slate-700 py-4 rounded-2xl font-bold">Maya T'aan</button>
                </div>
                <div id="form-nombre" class="hidden space-y-3">
                    <input type="text" id="nombre-input" placeholder="Nombre completo" class="w-full p-4 border-2 border-slate-100 rounded-2xl text-center font-bold outline-none">
                    <button onclick="confirmarTodo()" class="w-full bg-[#ff6b00] text-white py-4 rounded-2xl font-black uppercase shadow-lg">Confirmar número</button>
                </div>
            </div>
        </div>
        <img src="asist.png" class="maya-img" alt="Asistente">
    </div>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-full max-w-xs px-4">
        <button id="btn-registrar" disabled onclick="pedirNombre()" 
            class="w-full bg-[#002d72] text-white py-5 rounded-3xl font-black uppercase text-sm tracking-widest shadow-xl active:scale-95 disabled:opacity-50">
            Confirmar número
        </button>
    </div>

    <div id="btn-ir-arriba" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
    </div>

    
    
    
    
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdALyt2BfMCvtkkByTV2z2qjxcuTe4wnI3_s_STZknO_zLCPQ7edRKCtW5AjL6M-kG/exec";
        const textos = {
            es: { busca: "Busca tu número aquí abajo", registrar: "¡Toca Confirmar!", nombre: "Escribe tu nombre completo" },
            maya: { busca: "Kaaxat a xook", registrar: "T'aka' Reservar", nombre: "Ts'íibta a k'aaba'" }
        };

        let lang = 'es', elegido = null;

        function iniciar(l) {
            lang = l;
            document.getElementById('selector-idioma').classList.add('hidden');
            document.getElementById('asistente-contenedor').className = "pos-busqueda";
            document.getElementById('texto-asistente').innerText = textos[lang].busca;
            cargarOcupados();
        }

        function generarGrid() {
            const grid = document.getElementById('grid-numeros');
            grid.innerHTML = '';
            for (let i = 0; i < 1000; i++) {
                let n = i.toString().padStart(3, '0');
                let d = document.createElement('div');
                d.id = 'num-' + n; d.className = 'numero'; d.innerText = n;
                d.onclick = () => {
                    if(d.classList.contains('ocupado')) return;
                    if(elegido) {
                        const ant = document.getElementById('num-'+elegido);
                        if(ant) ant.classList.remove('seleccionado');
                    }
                    elegido = n;
                    d.classList.add('seleccionado');
                    document.getElementById('btn-registrar').disabled = false;
                    document.getElementById('texto-asistente').innerText = textos[lang].registrar;
                };
                grid.appendChild(d);
            }
        }

        function ejecutarBusqueda() {
            let val = document.getElementById('buscador').value.replace(/\D/g, '');
            document.querySelectorAll('.numero').forEach(n => { n.style.border = ""; n.style.transform = ""; });
            if (val.length >= 1) {
                let id = val.padStart(3, '0');
                const el = document.getElementById('num-' + id);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.style.border = "4px solid #ff6b00";
                    el.style.transform = "scale(1.2)";
                    const btnArriba = document.getElementById('btn-ir-arriba');
                    if(btnArriba) btnArriba.style.display = 'flex';
                }
            }
        }

        function elegirAlAzar() {
            const disponibles = Array.from(document.querySelectorAll('.numero:not(.ocupado)'));
            if (disponibles.length > 0) {
                const random = disponibles[Math.floor(Math.random() * disponibles.length)];
                random.click();
                random.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function pedirNombre() {
            document.getElementById('asistente-contenedor').className = "pos-centro";
            document.getElementById('texto-asistente').innerText = textos[lang].nombre;
            document.getElementById('form-nombre').classList.remove('hidden');
        }

        async function confirmarTodo() {
            const nom = document.getElementById('nombre-input').value.trim();
            if(!nom || !elegido) return;
            
            // Envío sincronizado: numero -> A, estado -> B, nombre -> C
            const urlFinal = SCRIPT_URL + "?numero=" + elegido + "&nombre=" + encodeURIComponent(nom) + "&estado=Vendido";
            fetch(urlFinal, { method: 'POST', mode: 'no-cors' });

            window.location.href = "https://m.me/168173419701763?text= ¡Hola! Aparté el número:" + elegido + "para la TV Hisense. Mi nombre es: " + nom + "Aquí te envío mis caturas de los pasos que seguí..." ;
        }

        async function cargarOcupados() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                data.forEach(item => {
                    const el = document.getElementById('num-' + String(item.numero).padStart(3, '0'));
                    if (el && (item.estado === "Vendido" || item.estado === "VENDIDO")) {
                        el.classList.add('ocupado');
                    }
                });
            } catch(e) { console.log("Sincronizando..."); }
        }

        generarGrid();
    </script>
</body>
</html>
