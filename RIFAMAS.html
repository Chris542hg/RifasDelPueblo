<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Grid - Smart TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');

        /* General body styles */
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            min-height: 100vh; /* Ensure full height */
            margin: 0;
            padding: 20px;
            flex-direction: column; /* Align items vertically */
            background-color: #f1f5f9;
        }

        .main-container {
            position: relative;
            background: #002d72;
            padding: 30px;
            border-radius: 40px;
            border: 8px solid white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            text-align: center; /* Center content */
            max-width: 800px; /* Limit width */
            margin: 20px auto;
            width: 100%;
            overflow: hidden; /* Para asegurar que los elementos absolutely positioned no se salgan */
            box-sizing: border-box;
            aspect-ratio: 3/4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
        }

        h1 {
            font-size: 60px;
            margin: 0;
            background: linear-gradient(180deg, #fff7ad 0%, #ffa500 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 0.9;
            font-weight: 900;
            text-transform: uppercase;
            filter: drop-shadow(0 4px 0px #853400);
        }
        
        h2 {
            font-size: 28px;
            margin: 5px 0 0 0;
            color: white;
            font-weight: 700;
        }

        .price-tag {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #002d72;
            display: inline-block;
            padding: 8px 30px;
            border-radius: 16px;
            font-size: 32px;
            font-weight: 900;
            margin: 15px 0;
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4);
            transform: rotate(-2deg);
            user-select: none; /* Evita que se seleccione el texto al hacer muchos clicks */
            cursor: context-menu; /* Un cursor sutil */
        }

        .grid-container {
            /* Grid layout for numbers */
            position: relative; /* Para el posicionamiento de los números */
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin: 30px 0;
            position: relative;
            padding: 10px; /* Add padding inside the grid */
        }

        /* Estilo de los números */
        .number {
            width: 100%;
            aspect-ratio: 1;
            background: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            color: #002d72;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid #e2e8f0;
            user-select: none; /* Prevent text selection */
        }

        .number:hover {
            transform: scale(1.1);
            border-color: #ff6b00;
        }

        /* Clase cuando ya está ocupado */
        .number.occupied {
            background: #1e3a8a !important;
            color: #64748b !important; 
            opacity: 0.4;
            border-color: #1e3a8a;
            position: relative; /* For the pseudo-element */
            cursor: not-allowed;
        }

        /* Espacio para la imagen central */
        .product-center {
            grid-column: 4 / 8;
            grid-row: 2 / 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .product-center img {
            width: 220px;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transform: rotate(5deg);
        }

        .caption {
            font-size: 10px;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .footer-info {
            text-align: center;
            font-weight: 800;
            font-size: 20px;
            margin-top: 20px;
            color: #e2e8f0;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .download-button {
            display: block;
            width: 280px;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            margin: 30px auto 0;
            padding: 15px 20px;
            background-color: #ff6b00;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }
        .download-button:hover { background-color: #e65100; transform: translateY(-2px); }

        /* Media query for smaller screens */
        @media (max-width: 600px) {
            body {
                padding: 2px;
            }
            .main-container {
                padding: 10px 4px;
                border-width: 4px;
                border-radius: 25px;
                aspect-ratio: auto;
            }
            h1 { font-size: 36px; margin-bottom: 0; }
            h2 { font-size: 16px; margin-top: 0; }
            .price-tag { font-size: 20px; padding: 5px 20px; margin: 10px 0; border-radius: 10px; }
            .grid-container {
                gap: 1px;
                margin: 10px 0;
                padding: 0;
            }
            .number {
                font-size: 9px;
                border-width: 1px;
                border-radius: 4px;
            }
            .product-center img { width: 100%; max-width: 130px; }
            .footer-info { font-size: 12px; margin-top: 10px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>GRAN SORTEO</h1>
    <h2>¡Podrás elegir tu premio!</h2>
    
    <div class="price-tag">$150 PESOS</div>

    <div class="grid-container" id="raffleGrid">
    </div>

    <div class="footer-info">
        ¡ALTAS PROBABILIDADES DE GANAR!<br>
        <span style="color:#ffd700; font-weight: 900;">FECHA: 27 DE MARZO</span>
    </div>
</div>

<button id="downloadBtn" class="download-button">Descargar Interfaz (PNG)</button>
<script>
    const PASSWORD = "lechugar1"; // Contraseña para desbloquear cambios
    const grid = document.getElementById('raffleGrid');
    
    // Crear la estructura de la cuadrícula
    function initRaffle() {
        // Insertamos la imagen central primero (posicionada por CSS)
        const center = document.createElement('div');

        // Initialize Firebase
        const firebaseConfig = { apiKey: "AIzaSyCbqIqn0eXyDUivyIxBqAfctC6rQz2R4nc", authDomain: "rifas-del-pueblo.firebaseapp.com", databaseURL: "https://rifas-del-pueblo-default-rtdb.firebaseio.com", projectId: "rifas-del-pueblo", storageBucket: "rifas-del-pueblo.firebasestorage.app", appId: "1:185703555080:web:f04d46b4d40ed0c81bb1bd" };


        firebase.initializeApp(firebaseConfig);

        center.className = 'product-center';
        center.innerHTML = `
            <img src="SORTEO.png" alt="Gran Sorteo">
            <div class="caption">Imágenes representativas</div>
        `;
        grid.appendChild(center);

                // Generar 100 números del 00 al 99
        for (let i = 0; i < 100; i++) {
            const numStr = i.toString().padStart(2, '0');
            const numBtn = document.createElement('div');
            numBtn.className = 'number';
            numBtn.innerText = numStr;
            numBtn.onclick = () => handleSelection(numBtn, numStr, numBtn);
            grid.appendChild(numBtn);
        }
    }

    function handleSelection(element, num) {
        if (element.classList.contains('occupied')) {
            // Si el número ya está ocupado, preguntar si se quiere liberar
            const confirmDelete = confirm(`El número ${num} está ocupado. ¿Deseas liberarlo?`);
            if (confirmDelete) {
                const password = prompt("Para liberar el número, introduce la contraseña:");
                if (password === PASSWORD) {
                    element.classList.remove('occupied');
                    saveOccupiedNumbers(); // Guardar el estado actualizado
                } else if (password !== null) { // No mostrar alerta si el usuario presiona "Cancelar"
                    alert("Contraseña incorrecta. El número no ha sido liberado.");
                }
            }
            return; // Terminar la función aquí para números ocupados
        }

         // Solicitar confirmación para ocupar un número, sin contraseña
         const confirm1 = confirm(`¿Deseas seleccionar el número ${num}?`);

            if (confirm1) {
                const confirm2 = confirm(`¿Confirmas que el número ${num} ya está pagado/ocupado?`);
            
                if (confirm2) {
                    markNumberAsOccupied(element, num);
                }
            }
    }

     // Función para marcar un número como ocupado y actualizar el almacenamiento local
     function markNumberAsOccupied(element, num) {
        element.classList.add('occupied');
        saveOccupiedNumbers(); // Guardar el estado actualizado
    }

    // Función para guardar los números ocupados en localStorage
    function saveOccupiedNumbers() {
         // Obtener la referencia a la base de datos de Firebase
        const database = firebase.database();
        const occupiedNumbers = Array.from(document.querySelectorAll('.number.occupied')).map(el => el.innerText);

        // Guardar los números ocupados en Firebase
        database.ref('BOLETOS RIFA TEMPORAL').set(occupiedNumbers)
            .then(() => {
                console.log('Números ocupados guardados en Firebase');
            })
            .catch((error) => {
                console.error('Error al guardar en Firebase:', error);
            });
    }

    // Función para cargar los números ocupados desde localStorage
    function loadOccupiedNumbers() {
         // Obtener la referencia a la base de datos de Firebase
        const database = firebase.database();

        // Leer los números ocupados desde Firebase
        database.ref('BOLETOS RIFA TEMPORAL').once('value')
            .then((snapshot) => {
                const occupiedNumbers = snapshot.val() || [];
                occupiedNumbers.forEach(num => {
                    const element = Array.from(document.querySelectorAll('.number')).find(el => el.innerText === num);
                    if (element) {
                        element.classList.add('occupied');
                    }
                });
        });
    }
     initRaffle();

    document.getElementById('downloadBtn').addEventListener('click', function() {
        html2canvas(document.querySelector(".main-container"), { backgroundColor: null, scale: 3, useCORS: true }).then(canvas => {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = 'rifa-sorteo.png';
            a.click();
        });
    });

      window.onload = loadOccupiedNumbers;

    // --- FUNCIÓN SECRETA: 5 CLICS EN EL PRECIO ---
    let secretClicks = 0;
    let resetTimer; // Variable para controlar el tiempo

    document.querySelector('.price-tag').addEventListener('click', (e) => {
        clearTimeout(resetTimer); // Limpiar el temporizador anterior al hacer clic
        secretClicks++;
        if (secretClicks === 5) {
            const pwd = prompt("☢️ ZONA PELIGROSA ☢️\nIngresa la contraseña para LIBERAR TODO:");
            if (pwd === PASSWORD) {
                if(confirm("¿Estás 100% seguro? Esto borrará todos los apartados y dejará el tablero limpio.")) {
                    document.querySelectorAll('.number.occupied').forEach(el => el.classList.remove('occupied'));
                    saveOccupiedNumbers();
                    alert("✅ ¡Tablero reseteado con éxito!");
                }
            }
            secretClicks = 0;
        }
        // Si deja de hacer click por 800ms, el contador se reinicia
        resetTimer = setTimeout(() => { secretClicks = 0; }, 800);
    });
</script>

</body>
</html>
